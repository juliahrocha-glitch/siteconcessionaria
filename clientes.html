<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes 😉</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
        <div id="geral">
        <header>
            <h1>Concessionária 🏎️</h1>
            <p>Os melhores carros te esperam aqui!</p>
        </header>
        <main>
        <div id="cadastro">
            <h1>Cadastro de clientes 😀</h1>
            <p>Insira as informações necessárias</p>
            <form action="clientes.php" method="post">
            <div id="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite aqui o nome do cliente" name="nome">
            </div>
            <div id="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="Ex: 000.000.000-00" name="cpf">
            </div>
            <div id="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite aqui o e-mail do cliente" name="email">
            </div>
            <div id="campo">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" placeholder="Ex: (00) 00000-0000" name="telefone">
            </div>
            <div id="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" placeholder="Digite aqui a cidade do cliente" name="cidade">
            </div>
            <div id="campo">
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" placeholder="Digite aqui o endereço do cliente" name="endereco">
            </div>
            <input type="submit" name="submit" value="Cadastrar">
            <button type="reset">Limpar 🧹</button>
            <button type="submit"name="voltar"> ◀️ Voltar </button>
             <a href="index.html">Voltar para o ínicio 🏠</a>
            <footer>Concessionária &copy; 2026 - Todos os direitos reservados</footer>
        </div>
        </form>
        </main>
</body>
</html>
